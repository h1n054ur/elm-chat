# Typecheck, build (repository checks + Wrangler dry run) and test on every push to main and every pull request.
# Runs on our Forgejo runners. node:22-bookworm: checkout is a JavaScript action and workerd needs glibc.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: docker
    container:
      image: node:22-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          # Same Bun that wrote bun.lock, so --frozen-lockfile agrees with it.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # The Workers tests need the generated apps/web/dist assets, so build first.
      - name: Build and repository checks
        run: bun run build
      - name: Test
        run: bun run test
